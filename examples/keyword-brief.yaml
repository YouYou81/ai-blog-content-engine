primary_keyword: "ai blog content engine"
language: "en"
audience: "SaaS growth teams and content operations teams"
search_intent: "commercial investigation"
target_region: "global"

keyword_pool:
  source: "google_sheets"
  sheet_id: "${GOOGLE_SHEET_ID}"
  row_id: "42"
  cluster: "ai seo automation"
  priority: "P1"
  owner: "content-ops"
  status: "selected"

brand:
  name: "Your Brand"
  homepage_url: "https://www.example.com"
  blog_url: "https://www.example.com/blog"
  tone: "clear, practical, technical, responsible"

pipeline:
  stages:
    - "topic_selection"
    - "outline"
    - "first_draft"
    - "seo_optimization"
    - "image_generation"
    - "publishing"
    - "gsc_tracking"

seo_quality_gate:
  readability_min_score: 70
  keyword_density_target: "0.8%-1.8%"
  require_eeat_review: true
  require_duplicate_check: true
  require_internal_links: true
  require_external_links: true

image_generation:
  provider: "dalle"
  aspect_ratio: "16:9"
  style: "clean technical editorial cover"

publishing:
  platform: "wordpress"
  create_draft: true
  upload_cover: true
  write_url_back_to_sheet: true

tracking:
  provider: "google_search_console"
  windows:
    - "7d"
    - "28d"
  write_metrics_back_to_sheet: true
